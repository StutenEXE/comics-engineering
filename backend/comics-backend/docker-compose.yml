services:
  # ─────────────────────────────────────────
  # PostgreSQL 18
  # ─────────────────────────────────────────
  postgres:
    image: postgres:18
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: kys_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
      POSTGRES_DB: ${KYS_POSTGRES_DB}
      PG_APP_USER: ${KYS_POSTGRES_USER}
      PG_APP_PASSWORD: ${KYS_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - kys-backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KYS_POSTGRES_USER} -d ${KYS_POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kys_redis
    restart: unless-stopped
    build:
      context: ./redis
      dockerfile: Dockerfile
    environment:
      REDIS_USER: ${KYS_REDIS_USER}
      REDIS_PASSWORD: ${KYS_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - kys-backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${KYS_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Schema migrations (Flyway) - runs once, then exits
  # Applies new files of postgres/migrations/ before the API starts.
  # Runs as the superuser (tables owner) so the API user keeps CRUD rights only.
  # ─────────────────────────────────────────
  migrate:
    image: flyway/flyway:13.9.0-alpine
    container_name: kys_migrate
    restart: "no"
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${KYS_POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_SUPERUSER}
      FLYWAY_PASSWORD: ${POSTGRES_SUPERPASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      # Existing databases created before Flyway already have the V1 schema :
      # mark them as V1 without executing it
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "1"
      # Fail fast (~7s) : postgres is already healthy, a connection error is a config error
      FLYWAY_CONNECT_RETRIES: "3"
    volumes:
      - ./postgres/migrations:/flyway/sql:ro
    networks:
      - kys-backend

  # ─────────────────────────────────────────
  # Java REST API  (Javalin + jOOQ)
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kys_main_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API only starts on an up to date schema
      migrate:
        condition: service_completed_successfully
    environment:
      # Postgres
      PG_HOST: postgres
      PG_PORT: 5432
      PG_NAME: ${KYS_POSTGRES_DB}
      PG_USER: ${KYS_POSTGRES_USER}
      PG_PASSWORD: ${KYS_POSTGRES_PASSWORD}
      PG_URL: ${KYS_POSTGRES_URL}
      # Redis
      REDIS_HOST: ${KYS_REDIS_HOST}
      REDIS_PORT: 6379
      REDIS_USER: ${KYS_REDIS_USER}
      REDIS_PASSWORD: ${KYS_REDIS_PASSWORD}
      # S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      # App
      APP_PORT: 8080
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}

    ports:
      - "8080:8080"
    networks:
      - kys-backend

volumes:
  postgres_data:
  redis_data:

networks:
  kys-backend:
    driver: bridge
