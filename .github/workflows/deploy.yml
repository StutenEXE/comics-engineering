name: Deploy to VPS

on:
  push:
    branches:
      - main
  # Manual run : redeploys both parts
  workflow_dispatch:

jobs:
  # Detects which parts of the app changed in the pushed commits
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - "frontend/**"
              - ".github/workflows/deploy.yml"
            backend:
              - "backend/**"
              - ".github/workflows/deploy.yml"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build with Vite
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_HOST: ${{ secrets.API_HOST }}
          VITE_SCRAPER_HOST: ${{ secrets.SCRAPER_HOST }}

      - name: Copy built frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "frontend/build/client/*"
          target: "/home/debian/comics-engineering/frontend/build/client/"
          strip_components: 3   # removes "frontend/build/client" prefix

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy - pull, write secrets, restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /home/debian/comics-engineering

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Write secrets from GitHub to .env file
            cd backend/comics-backend
            cat > .env.prod << 'ENDSECRETS'
            ${{ secrets.ENV_FILE }}
            ENDSECRETS

            # Backup the database before migrations run (deploy stops if it fails)
            make prod-backup

            # Apply schema migrations first : if they fail, the deploy stops and the API keeps running
            make prod-migrate

            # Rebuild and restart the containers
            make prod-up
